<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Retardos · El Boom Tractopartes</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800 antialiased">
  <div class="flex min-h-screen">
    <!-- Barra lateral -->
    <aside class="sticky top-0 hidden h-screen w-60 shrink-0 flex-col bg-brand-900 px-3 py-5 lg:flex print:hidden">
      <div class="mb-8 flex items-center gap-3 px-2">
        <div class="grid size-10 place-items-center rounded-xl bg-accent text-base font-black text-brand-900 shadow">EB</div>
        <div class="leading-tight">
          <div class="text-sm font-semibold text-white">El Boom</div>
          <div class="text-xs text-slate-400">Tractopartes · Asistencia</div>
        </div>
      </div>
      <nav id="nav" class="flex flex-col gap-1"></nav>
      <div class="mt-auto px-2">
        <label class="text-[11px] font-medium tracking-wide text-slate-400 uppercase" for="usuario">Usuario</label>
        <input id="usuario" class="mt-1 w-full rounded-lg border border-white/10 bg-white/10 px-3 py-2 text-sm text-white placeholder:text-slate-400 focus:border-accent focus:outline-none" placeholder="Su nombre" autocomplete="name">
        <p class="mt-1 text-[11px] text-slate-500">Su nombre queda registrado en cada cambio que haga.</p>
      </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <!-- Navegación móvil -->
      <header class="bg-brand-900 px-4 py-3 lg:hidden print:hidden">
        <div class="flex items-center gap-3 overflow-x-auto">
          <div class="grid size-8 shrink-0 place-items-center rounded-lg bg-accent text-xs font-black text-brand-900">EB</div>
          <nav id="navMobile" class="flex gap-1"></nav>
        </div>
        <input id="usuarioMobile" class="mt-3 w-full rounded-lg border border-white/10 bg-white/10 px-3 py-2 text-sm text-white placeholder:text-slate-400 focus:border-accent focus:outline-none" placeholder="Su nombre (queda registrado en cada cambio)" autocomplete="name">
      </header>

      <!-- Filtros del periodo -->
      <section id="filters" class="z-20 lg:sticky lg:top-0 border-b border-slate-200 bg-white/90 px-4 py-3 backdrop-blur lg:px-8 print:hidden">
        <div class="flex flex-wrap items-end gap-3">
          <label class="field">Periodo
            <select id="preset" class="input w-44">
              <option value="q-actual">Quincena actual</option>
              <option value="q-anterior">Quincena anterior</option>
              <option value="mes-actual">Mes actual</option>
              <option value="mes-anterior">Mes anterior</option>
              <option value="semana">Últimos 7 días</option>
              <option value="custom">Personalizado</option>
            </select>
          </label>
          <label class="field">Desde <input type="date" id="from" class="input w-40"></label>
          <label class="field">Hasta <input type="date" id="to" class="input w-40"></label>
          <label class="field">Sucursal <select id="branch" class="input w-48"><option value="all">Todas</option></select></label>
          <div class="relative w-full sm:w-72">
            <label class="field" for="gsearch">Buscar empleado</label>
            <span class="pointer-events-none absolute bottom-2.5 left-3 text-slate-400"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
            <input id="gsearch" class="input mt-1 pl-9" placeholder="Nombre o número de empleado" autocomplete="off">
            <div id="gsugg" class="absolute top-full right-0 left-0 z-40 mt-1 hidden max-h-80 overflow-auto rounded-xl border border-slate-200 bg-white shadow-lg"></div>
          </div>
          <div class="ml-auto flex flex-wrap items-center gap-2">
            <span id="livePill" class="hidden items-center gap-2 rounded-full border px-3 py-1.5 text-xs font-medium" role="status"></span>
            <button id="btnSync" class="btn btn-primary" title="Trae las checadas del periodo desde los relojes checadores">
              <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
              Actualizar desde checadores
            </button>
            <button id="btnExcel" class="btn btn-secondary">
              <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>
              Excel
            </button>
            <button id="btnPdf" class="btn btn-secondary" title="Reporte con indicadores y gráficas, listo para imprimir o enviar">
              <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h2"/></svg>
              PDF
            </button>
            <button id="btnPrint" class="btn btn-secondary">
              <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg>
              Imprimir
            </button>
          </div>
        </div>
      </section>

      <div id="printHeader" class="hidden px-2 pb-4 print:block"></div>
      <div id="restartBanner" class="mx-4 mt-4 hidden rounded-xl border border-rose-300 bg-rose-50 px-4 py-3 text-sm text-rose-900 lg:mx-8 print:hidden" role="alert">
        <b>El programa se actualizó y hay que reiniciarlo.</b> Cierre la ventana negra de <b>iniciar.bat</b> y vuelva a abrirla;
        mientras tanto algunos datos pueden salir incompletos o con palabras extrañas.
      </div>
      <main id="view" class="mx-auto w-full max-w-[1500px] flex-1 px-4 py-6 lg:px-8"></main>
    </div>
  </div>

  <dialog id="modal" class="m-auto w-[min(720px,95vw)] rounded-2xl bg-white p-0 shadow-2xl"><div id="modalBody" class="max-h-[85vh] overflow-auto p-6"></div></dialog>
  <dialog id="drawer" class="drawer w-[min(1200px,100vw)] bg-slate-50 p-0 shadow-2xl"><div id="drawerBody" class="h-full overflow-auto"></div></dialog>
  <div id="toasts" class="pointer-events-none fixed right-4 bottom-4 z-50 flex w-[min(420px,calc(100vw-2rem))] flex-col gap-2"></div>
  <script src="app.js"></script>
</body>
</html>
